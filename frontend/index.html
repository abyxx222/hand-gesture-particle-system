<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JARVIS // Memory OS</title></head>
<body><div id="app">
  <header class="topbar"><div class="brand"><span class="pulse"></span><div><b>JARVIS</b><small>PERSONAL MEMORY OS</small></div></div><div id="health" class="status">CONNECTING</div><button id="settingsToggle" class="icon">⚙</button></header>
  <aside class="left panel"><div class="eyebrow">MEMORY CONSTELLATION</div><div id="stats">Loading graph…</div><div id="nodeDetail" class="detail">Select a node to inspect its source.</div><div class="eyebrow tools-title">TOOLS</div><div id="toolList"></div></aside>
  <main class="stage"><div id="galaxy"></div><div class="overlay"><div class="eyebrow">COMMAND CONSOLE</div><div id="answer" class="answer">Ask anything about your memories.</div><div id="citations" class="citations"></div><div class="composer"><textarea id="query" rows="2" placeholder="Ask Jarvis…"></textarea><div class="composer-actions"><button id="voice" class="secondary">🎙 <span>Voice</span></button><button id="ask" class="primary">Transmit ↵</button></div></div><div id="streamState" class="stream-state"></div></div></main>
  <aside id="settings" class="right panel hidden"><div class="eyebrow">SYSTEM CONFIG</div><label>Provider<select id="provider"><option>mock</option><option>openai</option><option>anthropic</option><option>grok</option></select></label><label>Model<input id="model" value="mock"></label><button id="saveProvider" class="primary">Apply model</button><label class="toggle"><input id="wake" type="checkbox"> Wake word listening</label><button id="indexNotes" class="secondary">Index NOTES_PATH</button><div id="indexStatus" class="detail"></div><div class="eyebrow">PERSONALITY</div><div id="personality" class="detail">Loading…</div></aside>
  <div id="approval" class="modal hidden"><div class="modal-card"><h2>Approval required</h2><p id="approvalText"></p><button id="deny" class="secondary">Cancel</button><button id="approve" class="primary">Approve once</button></div></div>
</div><script type="module" src="/src/main.js"></script></body></html>
